<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Agrícola Huarmey - Ausentismo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#1F5C3A">
  <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
</head>
<body>
  <header>
    <div class="brand"><img class="logo" src="logo.png" alt="Frusan" width="54" height="54"><div><h1>Agrícola Huarmey</h1><p>Registro de ausentismo</p></div></div>
    <div id="status" class="pill online"><i></i><span id="status-text">Comprobando…</span></div>
  </header>

  <main>
    <section id="view-nuevo" class="view active">
      <form id="ausentismo-form" novalidate>
        <fieldset>
          <legend>Movilidad</legend>
          <div class="field"><label for="placa">Placa</label><select id="placa" required></select></div>
          <div class="field"><label for="ruta">Ruta</label><input id="ruta" readonly placeholder="Se completa con la placa"></div>
        </fieldset>

        <fieldset>
          <legend>Trabajador</legend>
          <div class="field"><label for="buscar">Buscar por DNI o nombre</label>
            <input id="buscar" type="search" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="DNI o apellidos y nombres">
            <ul id="resultados" class="results" hidden></ul>
            <p id="dni-alert" class="hint" aria-live="polite"></p></div>
          <div class="field"><label for="dni">DNI</label><input id="dni" readonly placeholder="Se completa al elegir"></div>
          <div class="field"><label for="nombre">Apellidos y nombres</label><input id="nombre" readonly placeholder="Se completa al elegir"></div>
        </fieldset>

        <fieldset>
          <legend>Ausencia</legend>
          <div class="field"><label for="fechaFalta">Fecha de falta</label><input type="date" id="fechaFalta" required></div>
          <div class="field"><label for="motivo">Motivo</label>
            <select id="motivo" required>
              <option value="">Seleccione…</option>
              <option>Ninguno</option><option>Descanso médico (Absentismo)</option><option>Permiso con papeleta (Absentismo)</option>
              <option>Enfermedad</option><option>Problemas familiares</option><option>Transporte</option><option>Otro trabajo</option>
              <option>Desmotivación</option><option>Sacar tarjeta</option><option>Pago</option><option>Horario</option>
              <option>Alimentación</option><option>Campamento</option><option>Ambiente laboral</option><option>Renuncia</option>
              <option>Problemas con el caporal</option><option>Estudios</option><option>Viaje</option><option>Accidente</option>
              <option>No desea continuar</option>
            </select></div>
          <div class="field"><label for="observaciones">Observaciones <small id="obs-req"></small></label>
            <textarea id="observaciones" rows="3" placeholder="Detalle lo que el trabajador indicó"></textarea></div>
        </fieldset>

        <fieldset>
          <legend>Retorno</legend>
          <div class="field"><span class="label">¿Va a regresar?</span>
            <div class="seg">
              <label><input type="radio" name="vasARegresar" value="SI" checked><span>Sí</span></label>
              <label><input type="radio" name="vasARegresar" value="NO"><span>No</span></label>
              <label><input type="radio" name="vasARegresar" value="Lo está pensando"><span>Lo piensa</span></label>
            </div></div>
          <div id="group-retorno">
            <div class="field"><span class="label">Retorno</span>
              <div class="seg">
                <label><input type="radio" name="tipoRetorno" value="Inmediato" checked><span>Inmediato</span></label>
                <label><input type="radio" name="tipoRetorno" value="Específica"><span>Fecha</span></label>
              </div></div>
            <div class="field" id="group-fechaRetorno" hidden><label for="fechaRetorno">Fecha de retorno</label><input type="date" id="fechaRetorno"></div>
          </div>
        </fieldset>

        <div class="savebar"><button type="submit" id="btn-save" class="btn">Guardar registro</button></div>
      </form>
    </section>

    <section id="view-registros" class="view">
      <h2 class="title">Registros guardados</h2>
      <div id="records-list"></div>
    </section>

    <section id="view-config" class="view">
      <h2 class="title">Sincronización</h2>
      <div class="stats">
        <div><b id="n-pend">0</b><span>Pendientes</span></div>
        <div><b id="n-err">0</b><span>Con error</span></div>
        <div><b id="n-ok">0</b><span>Enviados</span></div>
      </div>
      <p id="last-sync" class="muted"></p>
      <button id="btn-sync" class="btn">Sincronizar ahora</button>
      <button id="btn-retry" class="btn ghost" hidden>Reintentar los que dieron error</button>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <nav>
    <button class="nav-btn active" data-view="view-nuevo"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>Registro</button>
    <button class="nav-btn" data-view="view-registros"><svg viewBox="0 0 24 24"><path d="M5 5h14M5 12h14M5 19h14"/></svg>Guardados<em id="nav-badge" hidden></em></button>
    <button class="nav-btn" data-view="view-config"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/></svg>Sincronizar</button>
  </nav>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
